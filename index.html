
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First GitHub Pages Site</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }

    .container {
      text-align: center;
      padding: 40px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 16px;
    }

    p {
      color: #94a3b8;
      font-size: 1.2rem;
    }

    .badge {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      border-radius: 8px;
      background: #2563eb;
      color: white;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Hello, GitHub Pages! 🚀</h1>
    <p>My first website deployed with GitHub Actions.</p>
    <div class="badge">Deployment successful!</div>
  </div>
</body>
</html>
